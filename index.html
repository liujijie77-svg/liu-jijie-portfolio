<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刘冀杰 — AI 视觉设计师</title>
<style>
/* ========= 设计 Token ========= */
:root{
  --bg-0:#06070a;
  --bg-1:#0b0c0e;
  --bg-2:#101114;
  --ink:#ece9e2;
  --ink-soft:rgba(236,233,226,.72);
  --ink-mute:#8b8b90;
  --ink-faint:#4a4b52;
  --accent:#7cf0d4;
  --accent-soft:rgba(124,240,212,.18);
  --accent-hot:#a6ffe8;
  --amber:#c9a96a;
  --hairline:rgba(255,255,255,.08);
  --hairline-strong:rgba(255,255,255,.16);
  --ease-out: cubic-bezier(.22,.9,.28,1);
  --ease-inout: cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
@supports(height:100dvh){html,body{height:100dvh}}
body{
  /* WebGL 不可用时的兜底背景（正常时被 canvas 覆盖） */
  background:
    radial-gradient(120% 95% at 50% 38%, #14332d 0%, #0a0d10 48%, #06070a 100%);
  color:var(--ink);
  font-family:"Space Grotesk","PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  cursor:none;
}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

/* 背景装饰层（canvas 之上，文字之下） */
.bg-layers{position:fixed;inset:0;pointer-events:none;z-index:1}
/* 网格层 */
.bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(var(--hairline) 1px, transparent 1px),
    linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
  background-size:72px 72px;
  -webkit-mask-image:radial-gradient(65% 55% at 50% 50%, #000 0%, transparent 75%);
  mask-image:radial-gradient(65% 55% at 50% 50%, #000 0%, transparent 75%);
  opacity:.45;
}
/* 顶部细线 */
.bg-rule-top,.bg-rule-bottom{
  position:absolute;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, var(--hairline-strong), transparent);
}
.bg-rule-top{top:clamp(60px,10vh,120px)}
.bg-rule-bottom{bottom:clamp(60px,10vh,120px)}
/* 扫描竖线（极弱） */
.bg-scan{
  position:absolute;top:0;bottom:0;width:1px;left:var(--sx,50%);
  background:linear-gradient(180deg, transparent, rgba(124,240,212,.35) 50%, transparent);
  opacity:.25;
  transform:translateX(-50%);
  transition:left .18s var(--ease-out);
}

/* 自定义光标 */
.cursor-dot, .cursor-ring{
  position:fixed;top:0;left:0;pointer-events:none;z-index:9999;
  transform:translate(-50%,-50%);will-change:transform;
}
.cursor-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);mix-blend-mode:screen}
.cursor-ring{
  width:36px;height:36px;border:1px solid rgba(255,255,255,.2);border-radius:50%;
  transition:width .25s,height .25s,border-color .25s;
}
body:hover .cursor-ring{border-color:rgba(124,240,212,.6)}
body.hover-go .cursor-ring{width:64px;height:64px;border-color:var(--accent)}
@media (pointer:coarse){ .cursor-dot,.cursor-ring{display:none}; body{cursor:pointer} }

/* ========= 布局骨架 ========= */
.frame{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none;z-index:2}

/* 顶部 */
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:clamp(20px,4vw,40px);
  font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mute);
}
.top-bar .brand{display:flex;align-items:center;gap:14px}
.top-bar .brand .mark{
  width:28px;height:28px;border:1px solid var(--hairline-strong);border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-family:"Space Grotesk";font-size:11px;color:var(--accent);
  position:relative;
}
.top-bar .brand .mark::after{
  content:"";position:absolute;inset:-4px;border:1px solid transparent;border-radius:50%;
  border-top-color:var(--accent);animation:spin 6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.top-bar .status{display:flex;gap:22px;align-items:center}
.top-bar .live{
  display:inline-flex;align-items:center;gap:8px;
}
.top-bar .live i{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 10px var(--accent);animation:blink 2.2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

/* 中央 */
.stage{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 clamp(20px,4vw,48px);
  perspective:1000px;
}
.meta{
  display:flex;align-items:center;gap:18px;
  font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--accent);
  margin-bottom:clamp(22px,3vw,40px);
}
.meta .sep{width:40px;height:1px;background:var(--accent-soft)}
h1.title{
  font-family:"Space Grotesk",sans-serif;
  font-size:clamp(48px,10vw,148px);
  font-weight:500;
  line-height:.96;
  letter-spacing:-.03em;
  text-align:center;
  max-width:12ch;
}
.title .line{display:block;white-space:nowrap}
.title .word{
  display:inline-block;
  background:linear-gradient(135deg, #ece9e2 0%, #c9a96a 45%, #7cf0d4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% 200%;
  animation:grad-shift 8s ease-in-out infinite;
}
@keyframes grad-shift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.title .stroke{
  display:inline-block;color:transparent;
  -webkit-text-stroke:1px rgba(236,233,226,.5);
  margin:0 .02em;
}
.title .dot{
  display:inline-block;color:var(--accent);
  text-shadow:0 0 30px rgba(124,240,212,.55);
}
/* 标题下方流动光条 */
.title-shine{
  margin-top:clamp(14px,2vw,22px);
  height:1px;width:min(420px,60vw);
  background:linear-gradient(90deg,
    transparent 0%, transparent 35%,
    rgba(124,240,212,.5) 50%,
    transparent 65%, transparent 100%);
  background-size:200% 100%;
  animation:shine 5s linear infinite;
  position:relative;
}
.title-shine::before{
  content:"";position:absolute;left:50%;top:-4px;
  width:9px;height:9px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 18px var(--accent),0 0 36px var(--accent);
  transform:translateX(-50%);
}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}

.sub{
  margin-top:clamp(22px,3vw,36px);
  font-size:clamp(12px,1.2vw,14px);
  letter-spacing:.32em;text-transform:uppercase;
  color:var(--ink-mute);
}
.sub span{color:var(--ink-faint);margin:0 14px}

/* 底部 */
.bottom-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:clamp(20px,4vw,40px);
  font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mute);
}
.bottom-bar .hint{display:flex;align-items:center;gap:12px}
.bottom-bar .hint .arrow-icon{
  width:22px;height:22px;border:1px solid var(--hairline);border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--accent);
  animation:bob 2s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* 主 CTA 按钮 */
.enter{
  pointer-events:auto;
  position:relative;
  display:inline-flex;align-items:center;gap:14px;
  border:1px solid var(--hairline-strong);
  padding:16px 30px;border-radius:999px;
  color:var(--ink);text-decoration:none;
  font-family:"Space Grotesk","PingFang SC",sans-serif;
  font-size:12px;letter-spacing:.28em;text-transform:uppercase;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:rgba(255,255,255,.025);
  overflow:hidden;
  transition:border-color .4s var(--ease-out),background .4s var(--ease-out),transform .4s var(--ease-out);
}
.enter::before{
  content:"";position:absolute;inset:0;border-radius:999px;
  box-shadow:inset 0 0 30px rgba(124,240,212,.0), 0 0 0 rgba(124,240,212,0);
  transition:box-shadow .5s var(--ease-out);
}
.enter::after{
  content:"";position:absolute;top:0;bottom:0;left:-100%;width:60%;
  background:linear-gradient(90deg, transparent, rgba(124,240,212,.18), transparent);
  transform:skewX(-20deg);
  transition:left .7s var(--ease-out);
}
.enter:hover{border-color:var(--accent);background:rgba(124,240,212,.05);transform:translateY(-2px)}
.enter:hover::before{box-shadow:inset 0 0 30px rgba(124,240,212,.12), 0 0 24px rgba(124,240,212,.18)}
.enter:hover::after{left:150%}
.enter .ico-arrow{
  width:18px;height:18px;border-radius:50%;
  background:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;
  color:#06231c;font-size:11px;font-weight:700;
  transition:transform .4s var(--ease-out);
}
.enter:hover .ico-arrow{transform:translateX(4px) rotate(-35deg)}

/* 底部中央 progress */
.progress{
  position:fixed;left:50%;bottom:clamp(24px,4vh,48px);transform:translateX(-50%);
  font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:var(--ink-faint);
  display:flex;align-items:center;gap:12px;z-index:3;
}
.progress .bar{
  width:80px;height:1px;background:var(--hairline);position:relative;overflow:hidden;
}
.progress .bar i{
  position:absolute;top:0;left:0;height:100%;width:var(--p,0%);
  background:linear-gradient(90deg,var(--accent),transparent);
}

/* ========= 进场 / 过渡动效 ========= */
.reveal{opacity:0;transform:translateY(22px);transition:opacity 1.2s var(--ease-out),transform 1.2s var(--ease-out)}
.reveal.in{opacity:1;transform:none}
.r1{transition-delay:.05s}.r2{transition-delay:.25s}.r3{transition-delay:.45s}
.r4{transition-delay:.65s}.r5{transition-delay:.85s}

/* 离开时的 transline 效果：黑幕从中央裂开 */
.transline{
  position:fixed;inset:0;z-index:1000;pointer-events:none;
  display:flex;flex-direction:column;
}
.transline .half{
  flex:1;background:var(--bg-0);
  transform:scaleY(0);
  transform-origin:center;
  transition:transform .7s cubic-bezier(.76,0,.24,1);
}
body.leaving .transline .half{transform:scaleY(1)}

/* 标题按字视差包裹 */
.title .char{display:inline-block;will-change:transform;transition:transform .15s var(--ease-out)}

/* ========= 移动端适配 ========= */
@media (max-width:900px){
  .top-bar,.bottom-bar{letter-spacing:.14em;font-size:10px;padding:clamp(16px,4vw,28px)}
  .top-bar{gap:12px}
  .top-bar .brand{gap:9px;min-width:0}
  .top-bar .brand .mark{width:24px;height:24px;font-size:10px;flex:none}
  .top-bar .status{flex:none}
  .meta{font-size:10px;letter-spacing:.2em;gap:10px;margin-bottom:clamp(16px,3vw,28px);flex-wrap:wrap;justify-content:center}
  .meta .sep{width:18px}
  .sub{font-size:10px;letter-spacing:.18em;white-space:nowrap}
  .sub span{margin:0 7px}
  .title{font-size:clamp(40px,12.5vw,96px);max-width:none}
  /* 底部进度条与底栏重叠，小屏隐藏 */
  .progress{display:none}
}
@media (max-width:560px){
  .top-bar .suffix,.top-bar .loc{display:none}
  .meta{letter-spacing:.14em}
  .meta .sep{display:none}
  .bottom-bar>.hint{display:none}
  .enter{padding:13px 22px;font-size:11px;letter-spacing:.2em;gap:10px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<!-- 背景装饰层 -->
<div class="bg-layers">
  <div class="bg-grid" id="bgGrid"></div>
  <div class="bg-rule-top"></div>
  <div class="bg-rule-bottom"></div>
  <div class="bg-scan" id="bgScan"></div>
</div>

<!-- 自定义光标 -->
<div class="cursor-dot" id="cd"></div>
<div class="cursor-ring" id="cr"></div>

<!-- 黑幕（离开时） -->
<div class="transline"><div class="half"></div><div class="half"></div></div>

<div class="frame">
  <!-- 顶部 -->
  <div class="top-bar reveal r1">
    <div class="brand">
      <span class="mark">LJ</span>
      <span>LIU JIJIE <span style="color:var(--ink-faint)">·</span> <span class="suffix">PORTFOLIO / 2026</span></span>
    </div>
    <div class="status">
      <span class="live"><i></i> AVAILABLE</span>
      <span class="loc">CHINA · REMOTE</span>
    </div>
  </div>

  <!-- 中央舞台 -->
  <div class="stage">
    <div class="meta reveal r2">
      <span class="sep"></span>
      <span>AIGC Designer · Manhua / Drama / TVC</span>
      <span class="sep"></span>
    </div>
    <h1 class="title reveal r3" id="mainTitle">
      <span class="line"><span class="word">一个人</span><span class="stroke">/</span></span>
      <span class="line"><span class="word">一支剧组</span></span>
    </h1>
    <div class="title-shine reveal r3"></div>
    <p class="sub reveal r4">AIGC 漫剧 <span>·</span> 微短剧 <span>·</span> TVC 广告</p>
  </div>

  <!-- 底部 -->
  <div class="bottom-bar reveal r5">
    <span>© 刘冀杰</span>
    <a class="enter" href="portfolio.html" id="enterBtn">
      <span>进入作品集</span>
      <span class="ico-arrow">→</span>
    </a>
    <div class="hint">
      <span>CLICK</span>
      <span class="arrow-icon">↓</span>
    </div>
  </div>
</div>

<!-- 底部进度 -->
<div class="progress reveal r5">
  <span>SESSION</span>
  <span class="bar"><i id="progBar"></i></span>
  <span id="progTxt">00 : 00</span>
</div>

<script>
/* ============ 进场 ============ */
requestAnimationFrame(()=>{
  document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
});

/* ============ 自定义光标 ============ */
const cd=document.getElementById('cd'), cr=document.getElementById('cr');
let cx=0,cy=0,rx=0,ry=0;
addEventListener('mousemove',e=>{
  cx=e.clientX;cy=e.clientY;
  cd.style.transform=`translate(${cx}px,${cy}px) translate(-50%,-50%)`;
  document.getElementById('bgScan').style.setProperty('--sx',cx+'px');
});
(function ring(){
  rx += (cx-rx)*0.14; ry += (cy-ry)*0.14;
  cr.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`;
  requestAnimationFrame(ring);
})();
const btn=document.getElementById('enterBtn');
btn.addEventListener('mouseenter',()=>document.body.classList.add('hover-go'));
btn.addEventListener('mouseleave',()=>document.body.classList.remove('hover-go'));

/* ============ 标题逐字视差 ============ */
const title=document.getElementById('mainTitle');
title.querySelectorAll('.word').forEach(w=>{
  // 把每个 .word 里的字拆成 <span class="char">
  w.innerHTML=[...w.textContent].map(c=>`<span class="char">${c}</span>`).join('');
});
let mx=0,my=0;
addEventListener('mousemove',e=>{
  mx=(e.clientX/innerWidth-.5); my=(e.clientY/innerHeight-.5);
  title.querySelectorAll('.char').forEach((c,i)=>{
    const factor=(i%5-2)*0.6; // 不同字不同幅度
    c.style.transform=`translate(${mx*factor*6}px, ${my*factor*6}px)`;
  });
});

/* ============ 底部进度（会话时长） ============ */
const startT=Date.now();
const pb=document.getElementById('progBar'), pt=document.getElementById('progTxt');
(function tick(){
  const s=Math.floor((Date.now()-startT)/1000);
  pt.textContent=String(Math.floor(s/60)).padStart(2,'0')+' : '+String(s%60).padStart(2,'0');
  pb.style.setProperty('--p', Math.min(100,s/600*100)+'%');
  requestAnimationFrame(tick);
})();

/* ============ 点击进入（transline 裂幕） ============ */
/* 先注册跳转，保证即使 WebGL 初始化失败，页面也不会变成死页 */
let leaving=false;
function go(){
  if(leaving)return; leaving=true;
  document.body.classList.add('leaving');
  setTimeout(()=>location.href='portfolio.html', 720);
}
document.body.addEventListener('click',go);
document.getElementById('enterBtn').addEventListener('click',e=>{e.stopPropagation();e.preventDefault();go()});

/* ============ WebGL 着色器背景（多层金属流体 + 辉光） ============ */
(function initBackground(){
const canvas = document.getElementById('gl');
if(!canvas) return;
let gl=null;
try{
  gl = canvas.getContext('webgl',{alpha:false,antialias:false,depth:false,powerPreference:'low-power'})
    || canvas.getContext('experimental-webgl');
}catch(e){ gl=null; }
if(!gl){ canvas.style.display='none'; return; }   // 回落到 body 的渐变背景

/* 移动端降配：减少 fbm 层数 + 限制像素比 */
const isSmall = innerWidth < 820 || matchMedia('(pointer:coarse)').matches;
const OCT = isSmall ? 3 : 5;
const MAX_DPR = isSmall ? 1.5 : 2;

const vert = `
attribute vec2 p;
void main(){ gl_Position = vec4(p,0.,1.); }
`;
const frag = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uMouse;

vec2 hash(vec2 p){
  p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)));
  return -1.0 + 2.0*fract(sin(p)*43758.5453123);
}
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(dot(hash(i),f), dot(hash(i+vec2(1,0)),f-vec2(1,0)),u.x),
             mix(dot(hash(i+vec2(0,1)),f-vec2(0,1)), dot(hash(i+vec2(1,1)),f-vec2(1,1)),u.x),u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.55;
  for(int i=0;i<${OCT};i++){ v += a*noise(p); p = p*2.03 + vec2(3.1,1.7); a *= 0.5; }
  return v;
}

// 带反射的金属流体 SDF
float metalFluid(vec2 p, float t){
  vec2 q = p*2.2 + vec2(t*0.3, -t*0.2);
  vec2 w = vec2(fbm(q), fbm(q + 7.3));
  vec2 w2 = vec2(fbm(q + 2.6*w + 1.7 + 0.4*t), fbm(q + 2.6*w + 8.3 - 0.3*t));
  return fbm(q + 2.2*w2);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / min(uRes.x,uRes.y);
  float t = uTime*0.07;

  // 鼠标视差（远距离）
  vec2 m = (uMouse - 0.5) * 0.25;
  vec2 p1 = uv*1.6 + m;
  vec2 p2 = uv*2.4 + m*0.5;

  // base 近黑（带极弱冷底）
  vec3 col = vec3(0.028, 0.030, 0.036);

  // 层 1：大面积金属流体（低饱和 teal）
  float f1 = metalFluid(p1, t);
  float band1 = smoothstep(0.08, 0.85, f1);
  vec3 tealMetallic = vec3(0.12, 0.55, 0.48);
  col += tealMetallic * band1 * 0.14;

  // 层 2：高密度流体带（更高频，更亮）
  float f2 = metalFluid(p2, t*1.3);
  float band2 = pow(smoothstep(0.4, 0.95, f2), 2.5);
  col += vec3(0.30, 0.88, 0.75) * band2 * 0.22;

  // 层 3：鼠标附近的辉光核心（触屏时固定在画面中心偏上）
  float dm = distance(uv, uMouse-0.5);
  float glowA = smoothstep(0.55, 0.0, dm);
  col += vec3(0.35, 0.95, 0.82) * pow(glowA, 3.5) * 0.45;

  // 层 4：上方极弱的琥珀反光（打破单一青绿）
  float amberBand = smoothstep(0.7, 0.0, abs(uv.y + 0.35));
  col += vec3(0.85, 0.62, 0.35) * fbm(uv*1.2 - t*0.5) * amberBand * 0.07;

  // 边缘暗化 + 底部阴影（制造舞台感）
  float vig = smoothstep(1.4, 0.3, length(uv));
  col *= vig;
  col *= 1.0 - smoothstep(0.55, 0.0, uv.y + 0.55) * 0.55; // 底部压暗
  col *= 1.0 - smoothstep(0.25, 0.0, uv.y - 0.55) * 0.75; // 顶部压暗

  // 细节：闪烁粒子（极少）
  float flick = fract(sin(dot(floor(uv*120.0), vec2(12.9898,78.233))) * 43758.5453 + uTime*0.8);
  float gridflick = step(0.997, flick) * smoothstep(0.5, 0.0, length(fract(uv*120.0)-0.5));
  col += vec3(0.85, 1.0, 0.95) * gridflick * 0.35;

  // 微颗粒 grain（极弱，提升质感）
  float g = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453);
  col += (g-0.5)*0.025;

  gl_FragColor = vec4(col, 1.0);
}
`;
function makeShader(type, src){
  const s = gl.createShader(type);
  if(!s) return null;
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.warn(gl.getShaderInfoLog(s));
    gl.deleteShader(s);
    return null;
  }
  return s;
}
const vs = makeShader(gl.VERTEX_SHADER, vert);
const fs = makeShader(gl.FRAGMENT_SHADER, frag);
if(!vs || !fs){ canvas.style.display='none'; return; }  // 着色器编译失败 → 用渐变兜底

const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
  console.warn(gl.getProgramInfoLog(prog));
  canvas.style.display='none'; return;
}
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const uRes=gl.getUniformLocation(prog,'uRes'), uTime=gl.getUniformLocation(prog,'uTime'), uMouse=gl.getUniformLocation(prog,'uMouse');
let mxs=.5,mys=.5,tmx=.5,tmy=.5;
addEventListener('mousemove',e=>{tmx=e.clientX/innerWidth;tmy=1-e.clientY/innerHeight});
function resize(){
  const dpr=Math.min(devicePixelRatio,MAX_DPR);
  canvas.width=Math.round(innerWidth*dpr); canvas.height=Math.round(innerHeight*dpr);
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize',resize); resize();

/* 上下文丢失时不要让画面永久黑屏 */
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();canvas.style.display='none';});
const t0=performance.now();
(function loop(){
  mxs+=(tmx-mxs)*0.05; mys+=(tmy-mys)*0.05;
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime,(performance.now()-t0)/1000);
  gl.uniform2f(uMouse,mxs,mys);
  gl.drawArrays(gl.TRIANGLES,0,3);

  requestAnimationFrame(loop);
})();
})();
</script>
